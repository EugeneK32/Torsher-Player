name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static repository checks
        run: python3 scripts/verify-source.py
      - name: Shell syntax
        run: bash -n build.sh

  build:
    needs: verify
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: windows-latest
            rid: win-arm64
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/TorsherPlayer/TorsherPlayer.csproj -r ${{ matrix.rid }}
      - name: Build
        run: dotnet build src/TorsherPlayer/TorsherPlayer.csproj -c Release -r ${{ matrix.rid }} --no-restore
