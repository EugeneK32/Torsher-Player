name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Static repository checks
        run: python3 scripts/verify-source.py
      - name: Shell syntax
        run: bash -n build.sh

  publish:
    needs: verify
    name: Publish ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            windows_native: true
          - runner: windows-latest
            rid: win-arm64
            windows_native: true
          - runner: ubuntu-latest
            rid: linux-x64
            windows_native: false
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            windows_native: false
          - runner: macos-15-intel
            rid: osx-x64
            windows_native: false
          - runner: macos-latest
            rid: osx-arm64
            windows_native: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 2
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch pinned Windows native dependencies
        if: matrix.windows_native
        shell: pwsh
        run: ./scripts/fetch-native.ps1 -Rid ${{ matrix.rid }}

      - name: Restore
        run: dotnet restore src/TorsherPlayer/TorsherPlayer.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: >-
          dotnet publish src/TorsherPlayer/TorsherPlayer.csproj
          -c Release
          -r ${{ matrix.rid }}
          --no-restore
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: >-
          python scripts/package-release.py
          --rid "${{ matrix.rid }}"
          --version "$VERSION"
          --input "artifacts/publish/${{ matrix.rid }}"
          --output-dir artifacts/release

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts/release
        run: sha256sum TorsherPlayer-* > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/release/*
          --verify-tag
          --generate-notes
          --title "Torsher Player $GITHUB_REF_NAME"
